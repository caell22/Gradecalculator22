<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h2 {
            color: #333;
        }
        form {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
        }
        input[type="number"] {
            padding: 8px;
            width: 100px;
            margin-right: 10px;
        }
        input[type="submit"] {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9f7ef;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

<h2>Grade Calculator</h2>
<form onsubmit="calculateGrade(); return false;">
    Enter Score: <input type="number" id="score" min="0" max="100" required>
    <input type="submit" value="Calculate Grade">
</form>

<div id="result" class="result">
    <h3 id="scoreDisplay"></h3>
    <h3 id="gradeDisplay"></h3>
</div>

<script>
    function calculateGrade() {
        const score = parseInt(document.getElementById('score').value);
        let grade;
        
        if (score >= 90) {
            grade = 'A';
        } else if (score >= 80) {
            grade = 'B';
        } else if (score >= 70) {
            grade = 'C';
        } else if (score >= 60) {
            grade = 'D';
        } else {
            grade = 'F';
        }
        
        document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
        document.getElementById('gradeDisplay').textContent = `Grade: ${grade}`;
        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
